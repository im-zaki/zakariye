
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #244bc5;
            overflow: hidden;
            position: relative;
        }

        /* Qaababka gadaasha */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            background: rgba(20, 55, 170, 0.18);
            pointer-events: none;
        }

        body::before {
            width: 850px;
            height: 850px;
            top: -650px;
            left: 32%;
        }

        body::after {
            width: 650px;
            height: 650px;
            bottom: -350px;
            left: -250px;
        }

        /* Sanduuqa login-ka */
        .login-box {
            width: 390px;
            max-width: 90%;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        /* Calaamadda gaariga */
        .cart-icon {
            width: 150px;
            height: 150px;
            margin: 0 auto 65px;
            color: white;
        }

        /* Username iyo Password */
        .input-box {
            width: 100%;
            height: 58px;
            display: flex;
            align-items: center;
            gap: 22px;
            padding: 0 17px;
            margin-bottom: 25px;
            border: 1.5px solid white;
            border-radius: 5px;
            color: white;
        }

        .input-box svg {
            width: 23px;
            height: 23px;
            flex-shrink: 0;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            color: white;
            font-size: 16px;
        }

        .input-box input::placeholder {
            color: #e1e7ff;
            opacity: 1;
        }

        /* Badhanka LOGIN */
        .login-button {
            width: 100%;
            height: 58px;
            margin-top: 30px;
            border: none;
            border-radius: 5px;
            background: white;
            color: #244bc5;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 5px rgba(0, 0, 0, 0.25);
        }

        /* Forgot password */
        .forgot-password {
            display: block;
            margin-top: 17px;
            color: white;
            font-size: 20px;
            text-decoration: none;
            text-align: right;
        }

        /* Shaashadaha yaryar */
        @media (max-width: 480px) {
            .login-box {
                width: 340px;
            }

            .cart-icon {
                margin-bottom: 45px;
            }

            .forgot-password {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="login-box">

        <!-- Calaamadda gaariga -->
        <svg class="cart-icon" viewBox="0 0 150 150"
             fill="none" stroke="currentColor"
             stroke-width="4.5" stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M15 20 H29 Q35 20 38 29 L59 106 Q61 113 69 113 H119 Q126 113 128 105 L140 65 Q142 61 148 61 H153"
                  transform="translate(-8 0)"/>
            <path d="M83 83 V42 M68 57 L83 42 L98 57"/>
            <circle cx="66" cy="132" r="7"/>
            <circle cx="101" cy="132" r="7"/>
        </svg>

        <!-- Username -->
        <div class="input-box">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6">
                <circle cx="12" cy="7" r="4"/>
                <path d="M4 21 V18 C4 14.5 7 13 12 13 C17 13 20 14.5 20 18 V21"/>
            </svg>

            <input type="text" placeholder="USERNAME">
        </div>

        <!-- Password -->
        <div class="input-box">
            <svg viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="1.6">
                <rect x="3" y="10" width="18" height="12" rx="2"/>
                <path d="M7 10 V7 A5 5 0 0 1 17 7 V10"/>
            </svg>

            <input type="password" placeholder="PASSWORD">
        </div>

        <!-- Login button -->
        <button class="login-button" type="button">
            LOGIN
        </button>

        <!-- Forgot password -->
        <a class="forgot-password" href="#">
            Forgot password?
        </a>

    </main>

</body>
</html>
